# dev overrides for catalog
image:
  repository: ecommerce/catalog
  tag: "0.1.0"                                # Kargo will bump this on promotion
  pullPolicy: Never

replicaCount: 2
autoscaling:
  enabled: false

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }
nodeSelector: {}
