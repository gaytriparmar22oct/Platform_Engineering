# dev overrides for catalog
image:
  repository: ecommerce/catalog
  tag: "0.2.1"                                # Kargo will bump this on promotion
  pullPolicy: IfNotPresent

replicaCount: 2
autoscaling:
  enabled: false

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }
nodeSelector: {}
podSecurityContext:
  runAsNonRoot: false
metrics:
  enabled: true
