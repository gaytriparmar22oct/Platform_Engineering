image:
  repository: ecommerce/frontend
  tag: "0.2.1"
  pullPolicy: IfNotPresent
replicaCount: 2
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }
nodeSelector: {}
podSecurityContext:
  runAsNonRoot: false
metrics:
  enabled: true

# Frontend exposes the UI; leave ingress off in dev until ingress controller installed.
ingress:
  enabled: false
