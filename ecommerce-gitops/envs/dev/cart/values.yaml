image:
  repository: ecommerce/cart
  tag: "0.2.0"
  pullPolicy: IfNotPresent
replicaCount: 2
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }
nodeSelector: {}
podSecurityContext:
  runAsNonRoot: false
metrics:
  enabled: false

dapr:
  enabled: true
  appId: "cart"
  appPort: 8002
