# Root "App of Apps". Watches apps/dev/ and materializes one Application per service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPO_URL                # e.g. https://github.com/your-org/Platform_Engineering.git
    targetRevision: main
    path: Platform_Engineering/ecommerce-gitops/apps/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
