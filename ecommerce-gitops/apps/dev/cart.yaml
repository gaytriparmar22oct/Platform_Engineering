apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cart-dev
  namespace: argocd
  finalizers: [ "resources-finalizer.argocd.argoproj.io" ]
spec:
  project: default
  sources:
    - repoURL: https://github.com/gaytriparmar22oct/Platform_Engineering.git
      targetRevision: main
      path: Platform_Engineering/ecommerce-charts/cart
      helm:
        releaseName: cart
        valueFiles:
          - $values/Platform_Engineering/ecommerce-gitops/envs/dev/cart/values.yaml
    - repoURL: https://github.com/gaytriparmar22oct/Platform_Engineering.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
