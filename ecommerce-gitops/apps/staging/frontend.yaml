apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-staging
  namespace: argocd
  finalizers: [ "resources-finalizer.argocd.argoproj.io" ]
  labels:
    kargo.akuity.io/stage: staging
spec:
  project: default
  sources:
    - repoURL: https://github.com/gaytriparmar22oct/Platform_Engineering.git
      targetRevision: main
      path: ecommerce-charts/frontend
      helm:
        releaseName: frontend
        valueFiles:
          - $values/ecommerce-gitops/envs/staging/frontend/values.yaml
    - repoURL: https://github.com/gaytriparmar22oct/Platform_Engineering.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-staging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
