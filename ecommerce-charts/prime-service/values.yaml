# Prime Service Helm values
image:
  repository: "gaytriparmar/prime-service"
  tag: "1.1"
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
revisionHistoryLimit: 5

# --- prime-service specifics ---
containerPort: 8010

env:
  - name: PORT
    value: "8010"
envFrom: []

resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits:   { cpu: 250m, memory: 128Mi }

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 3
  periodSeconds: 5

service:
  type: LoadBalancer
  port: 8010
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  annotations: {}
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 0

metrics:
  enabled: true
  path: /metrics
  port: http
  interval: 30s
  scrapeTimeout: 10s
  release: prometheus-stack

dapr:
  enabled: false
  appId: ""
  appPort: 8010
  appProtocol: http
  config: ""
  logLevel: info

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: prime.localtest.me
      paths:
        - path: /
          pathType: Prefix
  tls: []
