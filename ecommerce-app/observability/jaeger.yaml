# Jaeger "all-in-one" for the ecommerce app (dev / docker-desktop).
# Bundles the OTLP collector, in-memory storage, and the query UI in one pod.
# In-memory storage means traces are lost on restart — fine for local demos,
# NOT for production (use the Jaeger Operator + Elasticsearch/Cassandra there).
#
# Deployed into the ecommerce-dev namespace so the app's unqualified endpoint
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger-collector:4317) resolves locally.
#
#   kubectl --context docker-desktop apply -f jaeger.yaml
#   kubectl --context docker-desktop -n ecommerce-dev port-forward svc/jaeger-query 16686:16686
#   open http://localhost:16686
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: all-in-one
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          args:
            - "--memory.max-traces=50000"
          env:
            - name: COLLECTOR_OTLP_ENABLED   # enable the OTLP receiver (4317/4318)
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: "memory"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: query-ui
              containerPort: 16686
            - name: admin-http
              containerPort: 14269
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
# Collector service — services send OTLP spans here (matches
# OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger-collector:4317 in the Helm charts).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
# Query service — the Jaeger web UI (port-forward this to view traces).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: ecommerce-dev
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: query-ui
      port: 16686
      targetPort: 16686
