services:
  catalog:
    build: ./services/catalog
    image: ecommerce/catalog:0.1.0
    ports: ["8001:8001"]
    environment:
      PORT: "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 10s

  cart:
    build: ./services/cart
    image: ecommerce/cart:0.1.0
    ports: ["8002:8002"]
    environment:
      PORT: "8002"

  orders:
    build: ./services/orders
    image: ecommerce/orders:0.1.0
    ports: ["8003:8003"]
    environment:
      PORT: "8003"
      CATALOG_URL: "http://catalog:8001"
    depends_on:
      - catalog

  frontend:
    build: ./services/frontend
    image: ecommerce/frontend:0.1.0
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      CATALOG_URL: "http://catalog:8001"
      CART_URL: "http://cart:8002"
      ORDERS_URL: "http://orders:8003"
    depends_on:
      - catalog
      - cart
      - orders
